name: Setup repository-scoped Codex Rust compiler cache
description: Restore and configure one repository-scoped local sccache directory.

outputs:
  cache_hit:
    description: Whether the exact immutable cache key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache_matched_key:
    description: Exact or prefix-matched cache key restored by GitHub Actions.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  cache_primary_key:
    description: Immutable key to use when saving the updated local cache.
    value: ${{ steps.restore.outputs.cache-primary-key }}

inputs:
  cache_mode:
    description: "Compiler cache access mode: read-only, read-write, or off."
    required: false
    default: read-only
  cargo_home:
    description: Absolute isolated Cargo home below RUNNER_TEMP.
    required: true
  sccache_version:
    description: Exact sccache version from the reviewed compatibility build profile.
    required: true
  sccache_dir:
    description: Absolute local sccache directory below RUNNER_TEMP.
    required: true
  source_root:
    description: Absolute patched Codex source root used to normalize compiler inputs.
    required: true
  target:
    description: Exact Rust target owned by the calling build shard.
    required: true

runs:
  using: composite
  steps:
    - id: config
      name: Validate isolated cache configuration
      shell: pwsh
      env:
        CSA_CACHE_MODE: ${{ inputs.cache_mode }}
        CSA_CARGO_HOME: ${{ inputs.cargo_home }}
        CSA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CSA_EVENT_NAME: ${{ github.event_name }}
        CSA_REF: ${{ github.ref }}
        CSA_SCCACHE_DIR: ${{ inputs.sccache_dir }}
        CSA_SOURCE_ROOT: ${{ inputs.source_root }}
        CSA_TARGET: ${{ inputs.target }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:CSA_CACHE_MODE -notin @('read-only', 'read-write', 'off')) {
          throw "Unsupported compiler cache mode: $env:CSA_CACHE_MODE"
        }
        if ($env:CSA_CACHE_MODE -eq 'read-write') {
          if (
            $env:CSA_EVENT_NAME -ne 'workflow_dispatch' -or
            $env:CSA_REF -ne "refs/heads/$env:CSA_DEFAULT_BRANCH"
          ) {
            throw 'Read-write compiler cache access requires a default-branch workflow dispatch.'
          }
        }
        $comparison = if ($IsWindows) {
          [StringComparison]::OrdinalIgnoreCase
        } else {
          [StringComparison]::Ordinal
        }
        $separator = [IO.Path]::DirectorySeparatorChar
        $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
          [IO.Path]::DirectorySeparatorChar,
          [IO.Path]::AltDirectorySeparatorChar
        ) + $separator
        foreach ($entry in @(
          @{ Name = 'Cargo home'; Path = $env:CSA_CARGO_HOME },
          @{ Name = 'sccache directory'; Path = $env:CSA_SCCACHE_DIR },
          @{ Name = 'Codex source'; Path = $env:CSA_SOURCE_ROOT }
        )) {
          $fullPath = [IO.Path]::GetFullPath($entry.Path)
          if (-not (($fullPath.TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          ) + $separator).StartsWith($runnerTemp, $comparison))) {
            throw "$($entry.Name) must live below RUNNER_TEMP: $fullPath"
          }
        }
        $cargoHome = [IO.Path]::GetFullPath($env:CSA_CARGO_HOME)
        New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
        "CARGO_HOME=$cargoHome" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        # Cache versions hash the literal path: restore and save must use this same value.
        $sccacheDir = [IO.Path]::GetFullPath($env:CSA_SCCACHE_DIR)
        "SCCACHE_DIR=$sccacheDir" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        if ($env:CSA_TARGET -like '*-pc-windows-msvc') {
          # LLVM COFF otherwise timestamps proc-macro DLLs, invalidating their dependants.
          $sourceDateEpoch = & git -C $env:CSA_SOURCE_ROOT show -s --format=%ct HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceDateEpoch -notmatch '^[0-9]+$') {
            throw 'Cannot determine the exact upstream source timestamp.'
          }
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        }
        if ($env:CSA_TARGET -eq 'x86_64-pc-windows-msvc') {
          # cc-rs skips the wrapper on automatic MSVC discovery. ARM64 must keep AWS-LC's Clang selection.
          @('CC=cl.exe', 'CXX=cl.exe') | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        }
        if ($env:CSA_CACHE_MODE -ne 'off') {
          $compiler = & rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the Rust compiler for caching.' }
          $cacheInputs = @($compiler)
          if (-not $env:RUNNER_OS -or -not $env:RUNNER_ARCH) {
            throw 'Runner OS and architecture are required for cache isolation.'
          }
          $environmentInputs = @("RUNNER_OS=$env:RUNNER_OS", "RUNNER_ARCH=$env:RUNNER_ARCH")
          if ($env:RUNNER_OS -eq 'macOS') {
            $appleCommands = [ordered]@{
              MACOS_VERSION = @('sw_vers', '-productVersion')
              MACOS_BUILD = @('sw_vers', '-buildVersion')
              MACOS_SDK_VERSION = @('xcrun', '--sdk', 'macosx', '--show-sdk-version')
              XCODE_VERSION = @('xcodebuild', '-version')
              APPLE_CLANG_VERSION = @('xcrun', 'clang', '--version')
            }
            foreach ($entry in $appleCommands.GetEnumerator()) {
              $command = $entry.Value[0]
              $arguments = $entry.Value[1..($entry.Value.Count - 1)]
              $identity = (& $command @arguments | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $identity) {
                throw "Cannot identify $($entry.Key) for cache isolation."
              }
              $environmentInputs += "$($entry.Key)=$identity"
            }
            $environmentInputs | Set-Content -LiteralPath (Join-Path $runnerTemp 'c/apple-toolchain.txt') -Encoding utf8
          }
          # The restore prefix must bind the environment too; a full-key hash alone is insufficient.
          $environmentBytes = [Text.Encoding]::UTF8.GetBytes(($environmentInputs -join "`n"))
          $environmentFingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($environmentBytes)).ToLowerInvariant()
          "environment_fingerprint=$environmentFingerprint" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          $cacheInputs += $environmentInputs
          foreach ($relative in @('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml')) {
            $path = Join-Path $env:CSA_SOURCE_ROOT "codex-rs/$relative"
            $cacheInputs += (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          if ($env:CSA_TARGET -like '*-unknown-linux-musl') {
            # Install musl tools first: wrapper contents include the pinned Zig path/target.
            foreach ($variable in @('CC', 'CXX')) {
              $path = [Environment]::GetEnvironmentVariable($variable)
              $cacheInputs += (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            }
            $cacheInputs += @($env:CFLAGS, $env:CXXFLAGS)
          }
          if ($env:CSA_TARGET -like '*-pc-windows-msvc') {
            # Seed a new immutable archive containing deterministic DLL dependants.
            $cacheInputs += "SOURCE_DATE_EPOCH=$sourceDateEpoch"
          }
          # ponytail: one dependency snapshot; add source identity only if workspace rebuilds dominate.
          $bytes = [Text.Encoding]::UTF8.GetBytes(($cacheInputs -join "`n"))
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "fingerprint=$fingerprint" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
        }

    - name: Install exact sccache
      if: inputs.cache_mode != 'off'
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v${{ inputs.sccache_version }}
        disable_annotations: true

    - id: restore
      name: Restore local compiler cache
      if: inputs.cache_mode != 'off'
      continue-on-error: true
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: csa-sccache-local-v3-${{ inputs.target }}-${{ inputs.sccache_version }}-${{ steps.config.outputs.environment_fingerprint }}-${{ steps.config.outputs.fingerprint }}
        restore-keys: |
          csa-sccache-local-v3-${{ inputs.target }}-${{ inputs.sccache_version }}-${{ steps.config.outputs.environment_fingerprint }}-

    - name: Configure repository compiler cache
      if: inputs.cache_mode != 'off'
      shell: pwsh
      env:
        CSA_CACHE_MODE: ${{ inputs.cache_mode }}
        CSA_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CSA_CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        CSA_CACHE_PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        CSA_SCCACHE_VERSION: ${{ inputs.sccache_version }}
        CSA_SOURCE_ROOT: ${{ inputs.source_root }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sccache = $env:SCCACHE_PATH
        if ($IsWindows -and $sccache -and -not (Test-Path -LiteralPath $sccache -PathType Leaf)) {
          $sccache = "$sccache.exe"
        }
        if (-not $sccache -or -not (Test-Path -LiteralPath $sccache -PathType Leaf)) {
          throw "sccache action did not expose an executable SCCACHE_PATH: $sccache"
        }
        $identity = (& $sccache --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or $identity -cne "sccache $env:CSA_SCCACHE_VERSION") {
          throw "sccache identity mismatch: $identity"
        }
        $sccacheDir = $env:SCCACHE_DIR
        New-Item -ItemType Directory -Force -Path $sccacheDir | Out-Null
        $settings = [ordered]@{
          CARGO_INCREMENTAL = '0'
          RUSTC_WRAPPER = $sccache
          SCCACHE_BASEDIRS = [IO.Path]::GetFullPath($env:CSA_SOURCE_ROOT)
          SCCACHE_CACHE_ZSTD_LEVEL = '10'
          SCCACHE_DIR = $sccacheDir
          SCCACHE_GHA_ENABLED = 'false'
          SCCACHE_IDLE_TIMEOUT = '0'
          SCCACHE_PATH = $sccache
        }
        foreach ($entry in $settings.GetEnumerator()) {
          [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value, 'Process')
          "$($entry.Key)=$($entry.Value)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        }
        & $sccache --start-server
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $sccache --zero-stats
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        @(
          '### Repository-scoped sccache configuration'
          ''
          "- version: ``$env:CSA_SCCACHE_VERSION``"
          "- mode: ``$env:CSA_CACHE_MODE``"
          "- primary archive key: ``$env:CSA_CACHE_PRIMARY_KEY``"
          "- restored archive key: ``$env:CSA_CACHE_MATCHED_KEY``"
          "- exact archive hit: ``$env:CSA_CACHE_HIT``"
          '- compression: `zstd level 10`'
          '- backend: local disk with GitHub Actions archive restore/save'
          '- source prefix normalization: enabled'
        ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

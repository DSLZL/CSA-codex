name: Restore isolated Cargo downloads
description: Restore Cargo registry and git downloads without caching compiler objects or target artifacts.

inputs:
  cache-scope:
    description: Stable scope such as the CSA Cargo.lock hash or an exact upstream Codex commit.
    required: true
  toolchain:
    description: Rust toolchain identifier used in the cache key.
    required: true
  cargo-home:
    description: Absolute isolated Cargo home below RUNNER_TEMP.
    required: true

runs:
  using: composite
  steps:
    - name: Configure isolated Cargo home
      id: cargo-home
      shell: pwsh
      env:
        CSA_CARGO_HOME: ${{ inputs.cargo-home }}
      run: |
        $ErrorActionPreference = 'Stop'
        $cargoHome = [IO.Path]::GetFullPath($env:CSA_CARGO_HOME)
        $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
        if (-not ($cargoHome + '\').StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
          throw "Cargo home must live below RUNNER_TEMP: $cargoHome"
        }
        New-Item -ItemType Directory -Force $cargoHome | Out-Null
        "CARGO_HOME=$cargoHome" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        "path=$cargoHome" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

    - name: Restore Cargo registry and git downloads
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ steps.cargo-home.outputs.path }}/registry/index
          ${{ steps.cargo-home.outputs.path }}/registry/cache
          ${{ steps.cargo-home.outputs.path }}/git/db
          ${{ steps.cargo-home.outputs.path }}/.global-cache
        key: csa-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-scope }}-${{ github.sha }}
        restore-keys: |
          csa-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-scope }}-
          csa-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-

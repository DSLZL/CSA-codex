name: Release patched Codex CLI

on:
  push:
    tags:
      - "compat-rust-v*-native-join-p*"
  workflow_dispatch:
    inputs:
      compat_selector:
        description: "current or one exact compatibility ID from release/compatibility-index.json"
        required: true
        default: current
        type: string
      target:
        description: Canonical validation target
        required: true
        default: x86_64-pc-windows-msvc
        type: string
      publish:
        description: Publish the formal GitHub Release after all target builds succeed
        required: true
        default: true
        type: boolean
      replace_published:
        description: Replace assets on one existing published compatibility Release
        required: true
        default: false
        type: boolean
      reuse_builds:
        description: Optional exact existing build set JSON with source_commit, request_id, and target run IDs
        required: false
        default: ""
        type: string

concurrency:
  group: csa-patched-codex-release-${{ inputs.compat_selector || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  plan:
    name: Resolve release authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_count: ${{ steps.matrix.outputs.artifact_count }}
      artifact_filename: ${{ steps.resolve.outputs.artifact_filename }}
      artifact_source_commit: ${{ steps.mode.outputs.artifact_source_commit }}
      build_target: ${{ steps.resolve.outputs.build_target }}
      codex_version: ${{ steps.resolve.outputs.codex_version }}
      compat_id: ${{ steps.resolve.outputs.compat_id }}
      manifest_path: ${{ steps.resolve.outputs.manifest_path }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish_requested: ${{ steps.mode.outputs.publish_requested }}
      request_id: ${{ steps.mode.outputs.request_id }}
      release_source_commit: ${{ steps.authority.outputs.release_source_commit }}
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      replace_published: ${{ steps.authority.outputs.replace_published }}
      reuse_requested: ${{ steps.mode.outputs.reuse_requested }}
      reuse_run_ids: ${{ steps.mode.outputs.reuse_run_ids }}
      rust_toolchain: ${{ steps.resolve.outputs.rust_toolchain }}
      sccache_version: ${{ steps.resolve.outputs.sccache_version }}
      source_commit: ${{ steps.mode.outputs.source_commit }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - id: mode
        name: Bind trigger to one source commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_COMPAT_SELECTOR: ${{ inputs.compat_selector }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_REPLACE_PUBLISHED: ${{ inputs.replace_published }}
          REQUESTED_REUSE_BUILDS: ${{ inputs.reuse_builds }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          artifact_source_commit="$source_commit"
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reuse_requested=false
          reuse_run_ids='{}'
          case "$GITHUB_EVENT_NAME" in
            push)
              [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == compat-* ]] || exit 2
              [[ "$(git cat-file -t "$GITHUB_REF")" == tag ]] || {
                echo "Formal compatibility tags must be annotated." >&2
                exit 2
              }
              test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$source_commit"
              git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              git merge-base --is-ancestor "$source_commit" "origin/$DEFAULT_BRANCH" || {
                echo "Formal compatibility tags must point to a commit on '$DEFAULT_BRANCH'." >&2
                exit 2
              }
              selector="${GITHUB_REF_NAME#compat-}"
              target=x86_64-pc-windows-msvc
              publish=true
              replace_published=false
              ;;
            workflow_dispatch)
              [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]] || {
                echo "Patched Codex releases must be dispatched from '$DEFAULT_BRANCH'." >&2
                exit 2
              }
              selector="$REQUESTED_COMPAT_SELECTOR"
              target="$REQUESTED_TARGET"
              publish="$REQUESTED_PUBLISH"
              replace_published="$REQUESTED_REPLACE_PUBLISHED"
              ;;
            *) exit 2 ;;
          esac
          if [[ -n "$REQUESTED_REUSE_BUILDS" ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$replace_published" == "false" ]] || {
              echo "Existing builds may only be reused by a normal workflow dispatch." >&2
              exit 2
            }
            mapfile -t reuse < <(python - <<'PY'
          import json
          import os
          import re

          value = json.loads(os.environ["REQUESTED_REUSE_BUILDS"])
          if not isinstance(value, dict) or set(value) != {"request_id", "runs", "source_commit"}:
              raise SystemExit("reuse_builds fields must be request_id, runs, and source_commit")
          source_commit = value["source_commit"]
          request_id = value["request_id"]
          runs = value["runs"]
          if not isinstance(source_commit, str) or not re.fullmatch(r"[0-9a-f]{40}", source_commit):
              raise SystemExit("reused source_commit must be lowercase 40-hex")
          if not isinstance(request_id, str) or not re.fullmatch(r"[A-Za-z0-9._-]{1,128}", request_id):
              raise SystemExit("reused request_id is invalid")
          if (
              not isinstance(runs, dict)
              or not runs
              or any(not isinstance(target, str) for target in runs)
              or any(type(run_id) is not int or run_id < 1 for run_id in runs.values())
          ):
              raise SystemExit("reused runs must map targets to positive integer run IDs")
          print(source_commit)
          print(request_id)
          print(json.dumps(runs, separators=(",", ":"), sort_keys=True))
          PY
            )
            artifact_source_commit="${reuse[0]}"
            request_id="${reuse[1]}"
            reuse_run_ids="${reuse[2]}"
            git cat-file -e "$artifact_source_commit^{commit}"
            git merge-base --is-ancestor "$artifact_source_commit" "$source_commit" || {
              echo "Reused builds must come from an ancestor of the workflow commit." >&2
              exit 2
            }
            reuse_requested=true
          fi
          {
            echo "artifact_source_commit=$artifact_source_commit"
            echo "compat_selector=$selector"
            echo "publish_requested=$publish"
            echo "request_id=$request_id"
            echo "replace_published=$replace_published"
            echo "reuse_requested=$reuse_requested"
            echo "reuse_run_ids=$reuse_run_ids"
            echo "source_commit=$source_commit"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - id: resolve
        name: Resolve committed compatibility authority
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ steps.mode.outputs.publish_requested }}
          REQUESTED_COMPAT_SELECTOR: ${{ steps.mode.outputs.compat_selector }}
          REQUESTED_TARGET: ${{ steps.mode.outputs.target }}
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            release_args+=(--require-release)
          fi
          python scripts/compat_catalog.py resolve \
            --repository . \
            --selector "$REQUESTED_COMPAT_SELECTOR" \
            --target "$REQUESTED_TARGET" \
            "${release_args[@]}" \
            --output "$RUNNER_TEMP/resolution.json" \
            --github-output "$GITHUB_OUTPUT"
          python scripts/compat_catalog.py validate --repository .

      - id: authority
        name: Resolve published release repair authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SOURCE_COMMIT: ${{ steps.mode.outputs.artifact_source_commit }}
          MANIFEST_PATH: ${{ steps.resolve.outputs.manifest_path }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          REPLACE_PUBLISHED: ${{ steps.mode.outputs.replace_published }}
          REQUESTED_COMPAT_SELECTOR: ${{ steps.mode.outputs.compat_selector }}
          PUBLISH_REQUESTED: ${{ steps.mode.outputs.publish_requested }}
          RESOLVED_COMPAT_ID: ${{ steps.resolve.outputs.compat_id }}
          REUSE_REQUESTED: ${{ steps.mode.outputs.reuse_requested }}
          WORKFLOW_COMMIT: ${{ steps.mode.outputs.source_commit }}
        run: |
          set -euo pipefail
          release_source_commit="$WORKFLOW_COMMIT"
          replace_published=false
          if [[ "$REUSE_REQUESTED" == "true" ]]; then
            [[ "$REQUESTED_COMPAT_SELECTOR" == "$RESOLVED_COMPAT_ID" ]] || {
              echo "Existing builds require one exact compatibility ID." >&2
              exit 2
            }
            git diff --quiet "$ARTIFACT_SOURCE_COMMIT" "$WORKFLOW_COMMIT" -- \
              payload release/build-profiles release/runtime-locks \
              .github/actions/setup-codex-rust-cache/action.yml \
              .github/workflows/build-patched-codex-target.yml \
              scripts/check_sccache_stats.py scripts/compat_catalog.py \
              scripts/compat_release.py scripts/verify_patch_payload.py || {
              echo "Existing builds cannot be reused after their build inputs changed." >&2
              exit 2
            }
          fi
          if [[ "$REPLACE_PUBLISHED" == "true" ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || exit 2
            [[ "$PUBLISH_REQUESTED" == "true" ]] || {
              echo "Published release repair requires publish=true." >&2
              exit 2
            }
            [[ "$REQUESTED_COMPAT_SELECTOR" == "$RESOLVED_COMPAT_ID" ]] || {
              echo "Published release repair requires one exact compatibility ID." >&2
              exit 2
            }
            state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
            [[ "$state" == $'false\tfalse' || "$state" == $'true\tfalse' ]] || {
              echo "Published release repair requires an existing non-prerelease Release." >&2
              exit 2
            }
            git fetch --force --tags origin
            [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]] || {
              echo "Published compatibility tags must remain annotated." >&2
              exit 2
            }
            release_source_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            git merge-base --is-ancestor "$release_source_commit" "origin/$DEFAULT_BRANCH" || {
              echo "Published compatibility tags must point to a commit on '$DEFAULT_BRANCH'." >&2
              exit 2
            }
            if [[ "$MANIFEST_PATH" == */bindings/* ]]; then
              payload_root="${MANIFEST_PATH%%/bindings/*}"
            else
              payload_root="${MANIFEST_PATH%/*}"
            fi
            git diff --quiet "$release_source_commit" "$WORKFLOW_COMMIT" -- "$payload_root" || {
              echo "Published release repair refused because its patch payload changed." >&2
              exit 2
            }
            replace_published=true
          fi
          {
            echo "release_source_commit=$release_source_commit"
            echo "replace_published=$replace_published"
          } >> "$GITHUB_OUTPUT"

      - name: Verify formal tag identity
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"

      - id: matrix
        name: Resolve native target matrix
        shell: bash
        env:
          REUSE_REQUESTED: ${{ steps.mode.outputs.reuse_requested }}
          REUSE_RUN_IDS: ${{ steps.mode.outputs.reuse_run_ids }}
        run: |
          set -euo pipefail
          python scripts/compat_release.py matrix \
            --manifest "$GITHUB_WORKSPACE/${{ steps.resolve.outputs.manifest_path }}" \
            > "$RUNNER_TEMP/matrix.json"
          python - "$RUNNER_TEMP/matrix.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          matrix_path, output_path = map(Path, sys.argv[1:])
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          expected = {item["target"] for item in matrix["include"]}
          runs = json.loads(os.environ["REUSE_RUN_IDS"])
          if os.environ["REUSE_REQUESTED"] == "true" and set(runs) != expected:
              raise SystemExit(f"reused target set differs: {sorted(runs)} != {sorted(expected)}")
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"artifact_count={len(matrix['include'])}\n")
          PY

  build:
    name: Build ${{ matrix.target }} in its shard
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - id: child
        name: Select exact child build
        shell: bash
        env:
          CHILD_REPOSITORY: ${{ matrix.repository }}
          CHILD_WORKFLOW: ${{ matrix.workflow }}
          COMPAT_ID: ${{ needs.plan.outputs.compat_id }}
          GH_TOKEN: ${{ secrets.BUILD_FANOUT_TOKEN }}
          REQUEST_ID: ${{ needs.plan.outputs.request_id }}
          REUSE_REQUESTED: ${{ needs.plan.outputs.reuse_requested }}
          REUSE_RUN_IDS: ${{ needs.plan.outputs.reuse_run_ids }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.artifact_source_commit }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            echo "Missing required Actions secret: BUILD_FANOUT_TOKEN" >&2
            exit 2
          }
          response="$RUNNER_TEMP/dispatch.json"
          if [[ "$REUSE_REQUESTED" == "true" ]]; then
            run_id="$(python -c 'import json, os; print(json.loads(os.environ["REUSE_RUN_IDS"])[os.environ["TARGET"]])')"
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$CHILD_REPOSITORY/actions/runs/$run_id" > "$response"
          else
            gh api --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$CHILD_REPOSITORY/actions/workflows/$CHILD_WORKFLOW/dispatches" \
              -f ref=main \
              -f "inputs[source_commit]=$SOURCE_COMMIT" \
              -f "inputs[compat_id]=$COMPAT_ID" \
              -f "inputs[request_id]=$REQUEST_ID" \
              > "$response"
          fi
          python - "$response" "$CHILD_REPOSITORY" "$REUSE_REQUESTED" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path = Path(sys.argv[1])
          repository = sys.argv[2]
          reuse = sys.argv[3] == "true"
          output_path = Path(sys.argv[4])
          summary_path = Path(sys.argv[5])
          response = json.loads(response_path.read_text(encoding="utf-8"))
          run_id = response.get("id" if reuse else "workflow_run_id")
          run_url = response.get("html_url")
          expected_url = f"https://github.com/{repository}/actions/runs/{run_id}"
          if type(run_id) is not int or run_id < 1 or run_url != expected_url:
              raise SystemExit("GitHub did not return the exact child run identity")
          if reuse and (response.get("event") != "workflow_dispatch" or response.get("path") != ".github/workflows/build.yml"):
              raise SystemExit("reused child run is not an exact build.yml workflow dispatch")
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\nrun_url={run_url}\n")
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write(f"- child run: [{repository} #{run_id}]({run_url})\n")
          PY

      - name: Wait for the exact child run
        shell: bash
        env:
          CHILD_REPOSITORY: ${{ matrix.repository }}
          GH_TOKEN: ${{ secrets.BUILD_FANOUT_TOKEN }}
          RUN_ID: ${{ steps.child.outputs.run_id }}
        run: |
          set -euo pipefail
          if ! gh run watch "$RUN_ID" --repo "$CHILD_REPOSITORY" --exit-status --interval 30; then
            gh run view "$RUN_ID" --repo "$CHILD_REPOSITORY" --log-failed || true
            exit 1
          fi

      - name: Download and verify the exact child artifact
        shell: bash
        env:
          CHILD_REPOSITORY: ${{ matrix.repository }}
          COMPAT_ID: ${{ needs.plan.outputs.compat_id }}
          GH_TOKEN: ${{ secrets.BUILD_FANOUT_TOKEN }}
          REQUEST_ID: ${{ needs.plan.outputs.request_id }}
          RUN_ID: ${{ steps.child.outputs.run_id }}
          RUNNER_LABEL: ${{ matrix.runner }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.artifact_source_commit }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/child-target"
          mkdir -p "$root"
          gh run download "$RUN_ID" --repo "$CHILD_REPOSITORY" \
            --name "patched-codex-target-${COMPAT_ID}-${TARGET}" \
            --dir "$root"
          python scripts/compat_release.py verify-target \
            --manifest "$GITHUB_WORKSPACE/${{ needs.plan.outputs.manifest_path }}" \
            --root "$root" \
            --request-id "$REQUEST_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --repository "$CHILD_REPOSITORY" \
            --runner "$RUNNER_LABEL" \
            --target "$TARGET" \
            --workflow-run-id "$RUN_ID"

      - name: Upload verified target into the central run
        uses: actions/upload-artifact@v7.0.1
        with:
          name: patched-codex-target-${{ needs.plan.outputs.compat_id }}-${{ matrix.target }}
          path: ${{ runner.temp }}/child-target
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    name: Aggregate ${{ needs.plan.outputs.artifact_count }} native targets
    needs: [plan, build]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_sha256: ${{ steps.collect.outputs.artifact_sha256 }}
      build_target: ${{ needs.plan.outputs.build_target }}
      codex_version: ${{ needs.plan.outputs.codex_version }}
      compat_id: ${{ needs.plan.outputs.compat_id }}
      publish_requested: ${{ needs.plan.outputs.publish_requested }}
      release_source_commit: ${{ needs.plan.outputs.release_source_commit }}
      release_enabled: ${{ needs.plan.outputs.release_enabled }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
      replace_published: ${{ needs.plan.outputs.replace_published }}
      source_commit: ${{ needs.plan.outputs.source_commit }}
      upstream_commit: ${{ needs.plan.outputs.upstream_commit }}
      upstream_tag: ${{ needs.plan.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Download every native target
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: patched-codex-target-${{ needs.plan.outputs.compat_id }}-*
          path: ${{ runner.temp }}/patched-targets

      - id: collect
        name: Verify complete target inventory
        shell: bash
        env:
          CANONICAL_TARGET: ${{ needs.plan.outputs.build_target }}
          EXPECTED_COUNT: ${{ needs.plan.outputs.artifact_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "patched-targets"
          records = [json.loads(path.read_text(encoding="utf-8")) for path in root.rglob("target-record.json")]
          targets = [record["target"] for record in records]
          if len(records) != int(os.environ["EXPECTED_COUNT"]) or len(set(targets)) != len(targets):
              raise SystemExit(f"target inventory mismatch: {targets}")
          canonical = next(record for record in records if record["target"] == os.environ["CANONICAL_TARGET"])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"artifact_sha256={canonical['sha256']}\n")
          PY

      - name: Assemble manual acceptance bundle
        if: needs.plan.outputs.publish_requested != 'true'
        shell: bash
        env:
          CANONICAL_TARGET: ${{ needs.plan.outputs.build_target }}
          REQUESTED_COMPAT_SELECTOR: ${{ needs.plan.outputs.compat_id }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/acceptance-candidate"
          mkdir -p "$root"
          python scripts/compat_catalog.py resolve \
            --repository . \
            --selector "$REQUESTED_COMPAT_SELECTOR" \
            --target "$CANONICAL_TARGET" \
            --output "$root/resolution.json"
          python - "$RUNNER_TEMP/patched-targets" "$root" <<'PY'
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          targets_root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          target = os.environ["CANONICAL_TARGET"]
          for record_path in targets_root.rglob("target-record.json"):
              record = json.loads(record_path.read_text(encoding="utf-8"))
              if record["target"] == target:
                  source = (record_path.parent / record["artifact"]).resolve(strict=True)
                  destination = output / "bundle" / record["artifact"]
                  destination.parent.mkdir(parents=True)
                  shutil.copy2(source, destination)
                  shutil.copy2(record_path, output / "bundle" / "target-record.json")
                  break
          else:
              raise SystemExit(f"missing canonical target artifact: {target}")
          PY
          python scripts/compat_catalog.py candidate \
            --repository . \
            --resolution "$root/resolution.json" \
            --artifact "$root/bundle/bin/${{ needs.plan.outputs.artifact_filename }}" \
            --output "$root/candidate-record.json" \
            --provider github-actions \
            --pipeline "$GITHUB_RUN_ID" \
            --job "build/$CANONICAL_TARGET" \
            --source-commit '${{ needs.plan.outputs.artifact_source_commit }}'
          cp -a "$RUNNER_TEMP/patched-targets" "$root/targets"
          python scripts/compat_release.py matrix \
            --manifest "$GITHUB_WORKSPACE/${{ needs.plan.outputs.manifest_path }}" \
            > "$root/matrix.json"

      - name: Upload manual acceptance bundle
        if: needs.plan.outputs.publish_requested != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: patched-codex-acceptance-${{ needs.plan.outputs.compat_id }}
          path: ${{ runner.temp }}/acceptance-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Finalize and pack multi-target release assets
        if: needs.plan.outputs.publish_requested == 'true'
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/finalized-repository"
          mkdir -p "$staged"
          cp -a payload "$staged/"
          manifest="$staged/${{ needs.plan.outputs.manifest_path }}"
          mapfile -t artifacts < <(python - "$RUNNER_TEMP/patched-targets" <<'PY'
          import json
          import sys
          from pathlib import Path
          for record_path in sorted(Path(sys.argv[1]).rglob("target-record.json")):
              record = json.loads(record_path.read_text(encoding="utf-8"))
              artifact = (record_path.parent / record["artifact"]).resolve(strict=True)
              print(f"{record['target']}={artifact}")
          PY
          )
          finalize=(python scripts/compat_release.py finalize --manifest "$manifest")
          pack=(python scripts/compat_release.py pack --manifest "$manifest")
          for artifact in "${artifacts[@]}"; do
            finalize+=(--artifact "$artifact")
            pack+=(--artifact "$artifact")
          done
          "${finalize[@]}"
          "${pack[@]}" --source-commit '${{ needs.plan.outputs.release_source_commit }}' --output "$RUNNER_TEMP/release-assets"
          python scripts/verify_release_asset_set.py local --root "$RUNNER_TEMP/release-assets"

      - name: Upload formal release assets
        if: needs.plan.outputs.publish_requested == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: patched-codex-cli-release-${{ needs.plan.outputs.compat_id }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish ${{ needs.bundle.outputs.release_tag }}
    needs: bundle
    if: needs.bundle.outputs.publish_requested == 'true' && needs.bundle.outputs.release_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: patched-codex-cli-release-${{ needs.bundle.outputs.compat_id }}
          path: ${{ runner.temp }}/patched-codex-release-assets

      - name: Build no-login install display catalog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bundle.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.bundle.outputs.release_source_commit }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          formal_tags="$RUNNER_TEMP/formal-compat-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("compat-"))) | .tag_name' \
            > "$formal_tags"
          python scripts/compat_catalog.py install-catalog \
            --repository . --formal-tags "$formal_tags" \
            --current-release-tag "$TAG" --current-source-commit "$SOURCE_COMMIT" \
            --all-targets \
            --output "$RUNNER_TEMP/patched-codex-release-assets/install-catalog-v1.json"

      - name: Recheck exact local asset authority
        run: |
          set -euo pipefail
          python scripts/verify_release_asset_set.py local \
            --root "$RUNNER_TEMP/patched-codex-release-assets" --require-install-catalog

      - name: Create or validate annotated compatibility tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bundle.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.bundle.outputs.release_source_commit }}
        run: |
          set -euo pipefail
          create_tag_object() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" -f message="$TAG" -f object="$RELEASE_SHA" -f type=commit --jq .sha
          }
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-parse "$TAG^{commit}")"
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              release_draft="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$TAG\") | .draft")"
              case "$release_draft" in
                false) echo "Published release $TAG remains anchored at $existing." ;;
                true|"")
                  tag_sha="$(create_tag_object)"
                  gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                    -f sha="$tag_sha" -F force=true >/dev/null
                  ;;
                *) exit 2 ;;
              esac
            fi
          else
            tag_sha="$(create_tag_object)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$tag_sha" >/dev/null
          fi
          git fetch --force --tags origin

      - name: Create or resume draft, upload idempotently, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bundle.outputs.release_tag }}
          CODEX_VERSION: ${{ needs.bundle.outputs.codex_version }}
          UPSTREAM_TAG: ${{ needs.bundle.outputs.upstream_tag }}
          UPSTREAM_COMMIT: ${{ needs.bundle.outputs.upstream_commit }}
          COMPAT_ID: ${{ needs.bundle.outputs.compat_id }}
          TARGET: ${{ needs.bundle.outputs.build_target }}
          SOURCE_COMMIT: ${{ needs.bundle.outputs.release_source_commit }}
          REPLACE_PUBLISHED: ${{ needs.bundle.outputs.replace_published }}
          PRODUCTION_CODEX_SHA256: ${{ needs.bundle.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/patched-codex-release-assets"
          notes="$RUNNER_TEMP/release-notes.md"
          remote="$RUNNER_TEMP/release.json"
          load_release() {
            local release_id
            release_id="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null)" || return 1
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$remote"
          }
          release_exists=false
          repairing_published=false
          if load_release; then
            existing_draft="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["draft"]).lower())' "$remote")"
            existing_prerelease="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["prerelease"]).lower())' "$remote")"
            [[ "$existing_prerelease" == false ]] || exit 2
            if [[ "$REPLACE_PUBLISHED" == true ]]; then
              if [[ "$existing_draft" == false ]]; then
                gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft
              fi
              repairing_published=true
            elif [[ "$existing_draft" == false ]]; then
              python scripts/verify_release_asset_set.py remote \
                --root "$root" --release-json "$remote" --require-install-catalog
              exit 0
            fi
            release_exists=true
          fi

          [[ "$REPLACE_PUBLISHED" != true || "$release_exists" == true ]] || {
            echo "Published release repair requires an existing Release." >&2
            exit 2
          }

          if [[ "$repairing_published" != true ]]; then
            python scripts/generate_release_notes.py \
              --repository . --current-ref "$SOURCE_COMMIT" \
              --compat-id "$COMPAT_ID" --codex-version "$CODEX_VERSION" \
              --upstream-tag "$UPSTREAM_TAG" --upstream-commit "$UPSTREAM_COMMIT" \
              --target "$TARGET" --artifact-sha256 "$PRODUCTION_CODEX_SHA256" --output "$notes"

            if [[ "$release_exists" == true ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                --title "CSA patched Codex CLI ${CODEX_VERSION}" --notes-file "$notes"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
                --title "CSA patched Codex CLI ${CODEX_VERSION}" --notes-file "$notes"
            fi
          fi

          mapfile -t assets < <(find "$root" -maxdepth 1 -type f -print | sort)
          (( ${#assets[@]} > 0 )) || exit 2
          declare -A expected=()
          for asset in "${assets[@]}"; do expected["$(basename "$asset")"]=1; done
          load_release
          mapfile -t remote_names < <(python - "$remote" <<'PY'
          import json
          import sys
          for asset in json.load(open(sys.argv[1], encoding="utf-8")).get("assets", []):
              if isinstance(asset.get("name"), str):
                  print(asset["name"])
          PY
          )
          for name in "${remote_names[@]}"; do
            if [[ -z "${expected[$name]+x}" ]]; then
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

          verified=false
          for attempt in {1..12}; do
            load_release
            if python scripts/verify_release_asset_set.py remote \
              --root "$root" --release-json "$remote" --require-install-catalog; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]] || exit 2
          if [[ "$repairing_published" == true ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false \
              --title "CSA patched Codex CLI ${CODEX_VERSION}" --notes-file "$notes"
          fi

      - name: Delete transient workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
            while read -r artifact_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            done

name: Build one patched Codex target

on:
  workflow_call:
    inputs:
      artifact_filename:
        required: true
        type: string
      compat_id:
        required: true
        type: string
      compiler_cache:
        required: false
        default: false
        type: boolean
      compiler_cache_save:
        required: false
        default: false
        type: boolean
      manifest_path:
        required: true
        type: string
      retention_days:
        required: false
        default: 14
        type: number
      runner:
        required: true
        type: string
      rust_toolchain:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      target:
        required: true
        type: string
      upstream_commit:
        required: true
        type: string
      upstream_tag:
        required: true
        type: string

env:
  CARGO_INCREMENTAL: "0"
  CARGO_FRONTEND: cargo
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  MBX_SUMMARY: full

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Configure isolated build roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/csa-patched-codex-${{ inputs.target }}"
          {
            echo "SOURCE_ROOT=$root/source"
            echo "CARGO_HOME=$root/cargo-home"
            echo "CARGO_TARGET_DIR=$root/cargo-target"
            echo "TARGET_BUNDLE=$root/bundle"
            echo "MBX_BYPASS_LOG=$root/mbx-bypass.log"
            echo "MBX_STATS=$root/mbx-stats.json"
          } >> "$GITHUB_ENV"
          mkdir -p "$root"

      - name: Clone exact reviewed upstream source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf "$SOURCE_ROOT"
            if git clone --filter=blob:none --no-checkout \
              --branch '${{ inputs.upstream_tag }}' --single-branch \
              https://github.com/openai/codex.git "$SOURCE_ROOT"; then
              break
            fi
            [[ "$attempt" != 3 ]] || exit 1
            sleep $((attempt * 5))
          done
          git -C "$SOURCE_ROOT" checkout --detach '${{ inputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = '${{ inputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse 'refs/tags/${{ inputs.upstream_tag }}^{commit}')" = '${{ inputs.upstream_commit }}'

      - name: Apply exact reviewed patch payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_patch_payload.py \
            --manifest "$GITHUB_WORKSPACE/${{ inputs.manifest_path }}" \
            --source "$SOURCE_ROOT" --apply

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ inputs.target }}

      - name: Restore isolated Cargo downloads
        uses: ./.github/actions/setup-codex-rust-cache
        with:
          cache-scope: ${{ inputs.upstream_commit }}
          toolchain: ${{ inputs.rust_toolchain }}
          cargo-home: ${{ runner.temp }}/csa-patched-codex-${{ inputs.target }}/cargo-home

      - name: Verify compiler-cache save authority
        if: inputs.compiler_cache_save && inputs.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.compiler_cache }}' = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = 'refs/heads/${{ github.event.repository.default_branch }}'

      - id: mbx
        name: Restore Mr. Boxington compiler closure
        if: inputs.compiler_cache && inputs.target != 'x86_64-apple-darwin'
        uses: jdx/mr-boxington-action@4fd4eab077dde1d635a289366f62c80cf6f11e6f # v1.1.0
        with:
          version: "1.4.1"
          cache-generation: csa-patched-codex-v2-${{ inputs.target }}
          save-on-workflow-dispatch: ${{ inputs.compiler_cache_save }}
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Verify Mr. Boxington compiler frontend
        if: inputs.compiler_cache && inputs.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          mbx doctor
          echo "CARGO_FRONTEND=mbx" >> "$GITHUB_ENV"

      - name: Record Intel macOS Cargo fallback
        if: inputs.compiler_cache && inputs.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          {
            echo '### Mr. Boxington unavailable for this target'
            echo
            echo 'MBX 1.4.1 does not publish an x86_64-apple-darwin binary; this job uses Cargo directly.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Zig for musl
        if: contains(inputs.target, 'linux-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install upstream musl build tools
        if: contains(inputs.target, 'linux-musl')
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          bash "$SOURCE_ROOT/.github/scripts/install-musl-build-tools.sh"
          {
            echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1"
            target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
            echo "${target_no_jitter}=1"
          } >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/codex-rs"
          version="$(python "$SOURCE_ROOT/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          binding_dir="$RUNNER_TEMP/rusty_v8"
          profile=ptrcomp_sandbox_release
          if [[ "$TARGET" == *-pc-windows-msvc ]]; then
            archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
          else
            archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
          fi
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          mkdir -p "$binding_dir"
          curl -fsSL "$base_url/$archive_name" -o "$binding_dir/$archive_name"
          curl -fsSL "$base_url/$binding_name" -o "$binding_dir/$binding_name"
          curl -fsSL "$base_url/$checksums_name" -o "$binding_dir/$checksums_name"
          test "$(wc -l < "$binding_dir/$checksums_name")" -eq 2
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$binding_dir" && tr -d '\r' < "$checksums_name" | sha256sum -c -)
          else
            (cd "$binding_dir" && tr -d '\r' < "$checksums_name" | shasum -a 256 -c -)
          fi
          {
            echo "RUSTY_V8_ARCHIVE=$binding_dir/$archive_name"
            echo "RUSTY_V8_SRC_BINDING_PATH=$binding_dir/$binding_name"
          } >> "$GITHUB_ENV"

      - name: Configure MSVC environment
        if: contains(inputs.target, 'windows-msvc')
        shell: pwsh
        env:
          TARGET: ${{ inputs.target }}
        run: '& "$env:SOURCE_ROOT/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target "$env:TARGET"'

      - name: Build Linux bwrap and export digest
        if: contains(inputs.target, 'linux-musl')
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/codex-rs"
          "$CARGO_FRONTEND" build --target "$TARGET" --release --timings --bin bwrap
          bwrap="$CARGO_TARGET_DIR/$TARGET/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$bwrap" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build patched Codex CLI
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/codex-rs"
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          "$CARGO_FRONTEND" build --target "$TARGET" --release --timings --bin codex
          if [[ "$TARGET" == *-unknown-linux-musl ]]; then
            codex="$CARGO_TARGET_DIR/$TARGET/release/codex"
            before_size="$(stat -c %s "$codex")"
            strip --strip-debug --strip-unneeded "$codex"
            after_size="$(stat -c %s "$codex")"
            echo "Stripped Linux Codex CLI: ${before_size} -> ${after_size} bytes"
          fi

      - name: Report Mr. Boxington cache observations
        if: always() && inputs.compiler_cache && inputs.target != 'x86_64-apple-darwin'
        continue-on-error: true
        shell: bash
        env:
          MBX_ACTION_CACHE_HIT: ${{ steps.mbx.outputs.cache-hit }}
          MBX_ACTION_KEY: ${{ steps.mbx.outputs.cache-primary-key }}
          MBX_ACTION_VERSION: ${{ steps.mbx.outputs.mbx-version }}
        run: |
          set +e
          {
            echo '### Mr. Boxington cache observation'
            echo
            echo "- action version: \`$MBX_ACTION_VERSION\`"
            echo "- action key: \`$MBX_ACTION_KEY\`"
            echo "- restored closure: \`$MBX_ACTION_CACHE_HIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if mbx cache stats --json > "$MBX_STATS"; then
            {
              echo
              echo '```json'
              cat "$MBX_STATS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'warning: Mr. Boxington cache statistics are unavailable' >&2
          fi
          if [[ -s "$MBX_BYPASS_LOG" ]]; then
            unknown_codegen="$(grep -F $'unknown-codegen-option\t' "$MBX_BYPASS_LOG" | sort -u)"
          else
            unknown_codegen=''
          fi
          if [[ -z "$unknown_codegen" ]]; then
            echo '- unknown codegen options: none observed' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo '#### Unknown codegen options'
              echo
              echo '```text'
              echo "$unknown_codegen"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage exact target artifact
        shell: bash
        env:
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
          COMPAT_ID: ${{ inputs.compat_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET: ${{ inputs.target }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          target = os.environ["TARGET"]
          filename = os.environ["ARTIFACT_FILENAME"]
          source = Path(os.environ["CARGO_TARGET_DIR"]) / target / "release" / filename
          root = Path(os.environ["TARGET_BUNDLE"])
          destination = root / "bin" / filename
          if not source.is_file():
              raise SystemExit(f"missing target artifact: {source}")
          destination.parent.mkdir(parents=True)
          shutil.copy2(source, destination)
          data = destination.read_bytes()
          record = {
              "schema": 1,
              "compat_id": os.environ["COMPAT_ID"],
              "target": target,
              "artifact": f"bin/{filename}",
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "upstream_commit": os.environ["UPSTREAM_COMMIT"],
              "source_commit": os.environ["SOURCE_COMMIT"],
          }
          (root / "target-record.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-codex-target-${{ inputs.compat_id }}-${{ inputs.target }}
          path: ${{ env.TARGET_BUNDLE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

name: Audit shared GitHub Actions cache

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and report without deleting cache entries
        required: true
        default: true
        type: boolean
      purge_legacy:
        description: Also delete recognized MBX and historical Cargo/sccache archives
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: csa-codex-actions-cache-maintenance
  cancel-in-progress: false

jobs:
  audit:
    name: Audit usage and optionally purge recognized legacy entries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      PURGE_LEGACY: ${{ inputs.purge_legacy && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Read complete repository cache inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            > "$RUNNER_TEMP/actions-cache-before.json"

      - id: plan
        name: Plan explicitly authorized legacy cleanup
        run: |
          set -euo pipefail
          args=(
            python scripts/actions_cache_policy.py
            --inventory "$RUNNER_TEMP/actions-cache-before.json"
            --output "$RUNNER_TEMP/actions-cache-plan.json"
            --github-output "$GITHUB_OUTPUT"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$PURGE_LEGACY" == true ]]; then
            args+=(--purge-legacy)
          fi
          "${args[@]}"
          if [[ "$DRY_RUN" == true ]]; then
            echo 'Cache audit is a dry run; no cache IDs will be deleted.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete only planned cache IDs
        if: env.DRY_RUN != 'true' && steps.plan.outputs.deletion_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t cache_ids < <(python - "$RUNNER_TEMP/actions-cache-plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for deletion in plan["deletions"]:
              cache_id = deletion["id"]
              if type(cache_id) is not int or cache_id < 1:
                  raise SystemExit("cache plan contains an invalid deletion ID")
              print(cache_id)
          PY
          )
          for cache_id in "${cache_ids[@]}"; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"; then
              continue
            fi
            echo "Delete failed for cache ID $cache_id; reconciling complete inventory." >&2
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
              > "$RUNNER_TEMP/actions-cache-reconcile.json"
            python - "$RUNNER_TEMP/actions-cache-reconcile.json" "$cache_id" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from actions_cache_policy import load_inventory

          inventory = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          cache_id = int(sys.argv[2])
          if any(entry.cache_id == cache_id for entry in load_inventory(inventory)):
              raise SystemExit(f"cache ID {cache_id} still exists after a failed exact-ID delete")
          print(f"cache ID {cache_id} was already absent")
          PY
          done

      - name: Report post-cleanup repository usage
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            > "$RUNNER_TEMP/actions-cache-after.json"
          python scripts/actions_cache_policy.py \
            --inventory "$RUNNER_TEMP/actions-cache-after.json" \
            --output "$RUNNER_TEMP/actions-cache-after-plan.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

name: Producer CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: "Optional successful central candidate build run ID"
        type: string
        default: ""
      candidate_manifest:
        description: "Repository manifest path for the optional candidate"
        type: string
        default: ""
      upstream_tui_baseline:
        description: "Optional compatibility ID for unpatched Windows TUI diagnostics"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: csa-codex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-tui-baseline:
    name: Unpatched Windows TUI diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.upstream_tui_baseline != ''
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - id: authority
        name: Resolve exact upstream from the candidate catalog
        shell: bash
        env:
          COMPAT_ID: ${{ inputs.upstream_tui_baseline }}
        run: |
          set -euo pipefail
          python scripts/compat_catalog.py resolve --repository . --selector "$COMPAT_ID" \
            --target x86_64-pc-windows-msvc --github-output "$GITHUB_OUTPUT"
          root="$RUNNER_TEMP/c"
          mkdir -p "$root"
          {
            echo "SOURCE_ROOT=$root/s"
            echo "CARGO_HOME=$root/h"
          } >> "$GITHUB_ENV"
      - name: Clone unpatched upstream
        shell: bash
        run: |
          set -euo pipefail
          git -c core.autocrlf=false clone --filter=blob:none --no-checkout \
            --branch '${{ steps.authority.outputs.upstream_tag }}' --single-branch \
            https://github.com/openai/codex.git "$SOURCE_ROOT"
          git -C "$SOURCE_ROOT" -c core.autocrlf=false checkout --detach '${{ steps.authority.outputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = '${{ steps.authority.outputs.upstream_commit }}'
          test "$(git -C "$SOURCE_ROOT" rev-parse 'refs/tags/${{ steps.authority.outputs.upstream_tag }}^{commit}')" = '${{ steps.authority.outputs.upstream_commit }}'
          test -z "$(git -C "$SOURCE_ROOT" status --porcelain)"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Configure exact compiler and upstream native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | grep -F 'commit-hash: ${{ steps.authority.outputs.rustc_commit }}'
          cd "$SOURCE_ROOT/codex-rs"
          version="$(python "$SOURCE_ROOT/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          binding_dir="$RUNNER_TEMP/rusty_v8"
          suffix=ptrcomp_sandbox_release_x86_64-pc-windows-msvc
          mkdir -p "$binding_dir"
          for file in "rusty_v8_${suffix}.lib.gz" "src_binding_${suffix}.rs" "rusty_v8_${suffix}.sha256"; do
            curl -fsSL "$base_url/$file" -o "$binding_dir/$file"
          done
          test "$(wc -l < "$binding_dir/rusty_v8_${suffix}.sha256")" -eq 2
          (cd "$binding_dir" && tr -d '\r' < "rusty_v8_${suffix}.sha256" | sha256sum -c -)
          {
            echo "RUSTY_V8_ARCHIVE=$binding_dir/rusty_v8_${suffix}.lib.gz"
            echo "RUSTY_V8_SRC_BINDING_PATH=$binding_dir/src_binding_${suffix}.rs"
            echo "LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"
      - name: Configure MSVC environment
        shell: pwsh
        run: '& "$env:SOURCE_ROOT/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target x86_64-pc-windows-msvc'
      - name: Compare directory and trust tests without CSA patches
        shell: bash
        env:
          BASELINE_MANIFEST: ${{ steps.authority.outputs.manifest_path }}
        run: |
          set -euo pipefail
          python -u - <<'PY' 2>&1 | tee "$RUNNER_TEMP/c/upstream-tui.log"
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from run_patch_contract import environment, load_contract
          from verify_patch_payload import _load_payload, _payload_file
          payload = _load_payload(Path(os.environ["BASELINE_MANIFEST"]).resolve())
          contract = load_contract(_payload_file(payload, "test-contract.json"), payload.manifest["compat_id"])
          step = next(step for step in contract["tests"] if step["name"] == "complete TUI library")
          source = Path(os.environ["SOURCE_ROOT"]).resolve()
          evidence = Path(os.environ["RUNNER_TEMP"]) / "c"
          env = environment(contract["common_env"], step.get("env", {}), source, evidence / "tests")
          command = ["cargo", "test", "-p", "codex-tui", "--lib"]
          names = [
              "app::agents_overview::tests::overview_cold_resume_honors_working_directory_selection",
              "app::agents_overview::tests::restored_server_permission_profile_survives_cd_without_turn_override",
              "app::tests::background_task_defaults_tests::command_center_new_reads_server_defaults_for_actual_destination",
              "app::tests::in_app_resume_uses_configured_or_explicit_cwd",
              "app::tests::remembered_current_cwd_stays_at_launch_across_in_app_resumes",
              "app::tests::session_lifecycle_requests::changing_directory_preserves_project_trust_permissions_history_and_hooks",
              "worktree_startup::tests::refreshed_bundle_rechecks_source_during_config_reload",
          ]
          listing = subprocess.check_output(command + ["--", "--list"], cwd=source / "codex-rs", env=env)
          (evidence / "upstream-tui-list.txt").write_bytes(listing)
          listed = set(listing.decode("utf-8").splitlines())
          assert all(f"{name}: test" in listed for name in names), "baseline test missing"
          results = []
          for name in names:
              print(f"Baseline test: {name}", flush=True)
              result = subprocess.run(command + [name, "--", "--exact", "--test-threads=1"], cwd=source / "codex-rs", env=env)
              results.append({"name": name, "exit_code": result.returncode})
          report = {"producer_commit": os.environ["GITHUB_SHA"], "upstream_commit": payload.manifest["upstream_commit"], "patched": False, "execution": "each selected test in a fresh process", "tests": results}
          (evidence / "upstream-tui-results.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(int(any(item["exit_code"] != 0 for item in results)))
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: upstream-tui-baseline
          path: ${{ runner.temp }}/c/upstream-tui*
          if-no-files-found: warn
          retention-days: 7

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Compile Python tooling
        run: python -m compileall -q scripts
      - name: Run producer contracts
        run: |
          python scripts/test_verify_patch_payload.py
          python scripts/test_compat_catalog.py
          python scripts/test_verify_release_asset_set.py
          python scripts/test_check_sccache_stats.py
          python scripts/test_compiler_cache_diagnostics.py
          python scripts/test_producer_tools.py
          python scripts/test_recover_sqlite_migrations.py
          python scripts/compat_catalog.py validate --repository .
          python scripts/compat_catalog.py guard-workflows .github/workflows/*.yml .github/actions/setup-codex-rust-cache/action.yml

  linux-recovery:
    name: Linux recovery ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["0.153.0", "0.153.2"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Fetch exact official inputs
        env:
          CODEX_VERSION: ${{ matrix.version }}
        run: |
          git clone --bare --depth 1 --branch "rust-v$CODEX_VERSION" https://github.com/openai/codex.git "$RUNNER_TEMP/upstream.git"
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path
          url = f"https://registry.npmjs.org/@openai/codex/-/codex-{os.environ['CODEX_VERSION']}-linux-x64.tgz"
          urllib.request.urlretrieve(url, Path(os.environ["RUNNER_TEMP"]) / "official.tgz")
          PY
      - name: Recover fixture home and resume official Codex
        env:
          CODEX_VERSION: ${{ matrix.version }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$CANDIDATE_RUN$CANDIDATE_MANIFEST" && "$CODEX_VERSION" == 0.153.2 ]]; then
            [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ && -n "$CANDIDATE_MANIFEST" ]]
            compat_id="$(python -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["compat_id"])' "$CANDIDATE_MANIFEST")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-run.json"
            gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "patched-codex-target-${compat_id}-x86_64-unknown-linux-musl" --dir "$RUNNER_TEMP/candidate"
            args+=(--candidate-manifest "$GITHUB_WORKSPACE/$CANDIDATE_MANIFEST" --candidate-bundle "$RUNNER_TEMP/candidate" --candidate-run "$RUNNER_TEMP/candidate-run.json")
          fi
          python scripts/verify_linux_sqlite_recovery.py \
            --manifest "$GITHUB_WORKSPACE/payload/codex/native-join-p10/bindings/rust-v${CODEX_VERSION}-native-join-p10/manifest.toml" \
            --source "$RUNNER_TEMP/upstream.git" --official-archive "$RUNNER_TEMP/official.tgz" \
            --run-root "$RUNNER_TEMP/native-recovery" "${args[@]}"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: linux-recovery-${{ matrix.version }}
          path: ${{ runner.temp }}/native-recovery/evidence
          if-no-files-found: warn
          retention-days: 7
